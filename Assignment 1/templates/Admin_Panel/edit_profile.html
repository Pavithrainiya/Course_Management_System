{% extends "index.html" %}
{% block content %}

<div class="edit-profile-page">
    <div class="container" style="padding-top: 80px;">
        <div class="edit-profile-card">
            <div class="card-header">
                <h2><i class="fa fa-edit"></i> Edit Profile</h2>
                <p>Update your personal information</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="profile-form">
                {% csrf_token %}
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">
                            <i class="fa fa-user"></i> First Name
                        </label>
                        <input type="text" 
                               id="first_name" 
                               name="first_name" 
                               class="form-control" 
                               value="{{ student.FirstName }}" 
                               required>
                    </div>

                    <div class="form-group">
                        <label for="last_name">
                            <i class="fa fa-user"></i> Last Name
                        </label>
                        <input type="text" 
                               id="last_name" 
                               name="last_name" 
                               class="form-control" 
                               value="{{ student.LastName }}" 
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fa fa-envelope"></i> Email Address
                    </label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           class="form-control" 
                           value="{{ student.Email }}" 
                           disabled>
                    <small class="form-text">Email cannot be changed</small>
                </div>

                <div class="form-group">
                    <label for="phone_number">
                        <i class="fa fa-phone"></i> Phone Number
                    </label>
                    <input type="text" 
                           id="phone_number" 
                           name="phone_number" 
                           class="form-control" 
                           value="{{ student.PhoneNumber }}" 
                           required>
                </div>

                <div class="form-group">
                    <label for="department">
                        <i class="fa fa-building"></i> Department
                    </label>
                    <input type="text" 
                           id="department" 
                           name="department" 
                           class="form-control" 
                           value="{{ student.Department }}" 
                           required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">
                        <i class="fa fa-save"></i> Save Changes
                    </button>
                    <a href="{% url 'Profile' %}" class="btn-cancel">
                        <i class="fa fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .edit-profile-page {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding-bottom: 50px;
    }

    .edit-profile-card {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .card-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 40px;
        text-align: center;
    }

    .card-header h2 {
        margin: 0 0 10px 0;
        font-size: 2rem;
    }

    .card-header p {
        margin: 0;
        opacity: 0.9;
    }

    .profile-form {
        padding: 40px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .form-group label i {
        color: #667eea;
        margin-right: 5px;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s;
    }

    .form-control:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-control:disabled {
        background: #f5f5f5;
        cursor: not-allowed;
    }

    .form-text {
        display: block;
        margin-top: 5px;
        color: #999;
        font-size: 0.85rem;
    }

    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
        padding-top: 30px;
        border-top: 2px solid #f0f0f0;
    }

    .btn-save, .btn-cancel {
        flex: 1;
        padding: 15px 30px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
    }

    .btn-save {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-cancel {
        background: #6c757d;
        color: white;
    }

    .btn-cancel:hover {
        background: #5a6268;
        text-decoration: none;
        color: white;
    }

    .alert {
        margin: 20px 40px 0;
        padding: 15px;
        border-radius: 10px;
        border-left: 4px solid;
    }

    .alert-success {
        background: #d4edda;
        border-color: #28a745;
        color: #155724;
    }

    .alert-error {
        background: #f8d7da;
        border-color: #dc3545;
        color: #721c24;
    }

    @media (max-width: 768px) {
        .form-row {
            grid-template-columns: 1fr;
        }

        .form-actions {
            flex-direction: column;
        }
    }
</style>

{% endblock %}
